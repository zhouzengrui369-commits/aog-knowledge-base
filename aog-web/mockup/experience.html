  <script>
    function getExpFromHash() {
      const h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
      if (!h) return null;
      return (window.EXPERIENCES || []).find(x => x.id === h) || (window.EXPERIENCES || [])[0];
    }

    function render() {
      const e = getExpFromHash();
      if (!e) { document.body.innerHTML = '<div class="p-10 text-center text-ink-500">未找到该经验。</div>'; return; }
      if (location.hash.replace(/^#/, '') !== e.id) history.replaceState(null, '', '#' + e.id);

      document.title = e.title + ' · AOG 知识库';
      document.getElementById('bcTitle').textContent = e.title;
      document.getElementById('title').textContent = e.title;
      document.getElementById('summary').textContent = e.summary || '';
      document.getElementById('created').textContent = e.created || '—';
      document.getElementById('updated').textContent = e.updated || '—';
      document.getElementById('author').textContent  = e.author  || '—';

      // topic pill
      const tc = { '流程':'bg-primary-50 text-primary-700', '规范':'bg-secondary/10 text-secondary', '案例':'bg-warning-50 text-warning-700', '培训':'bg-success-50 text-success-700', '技术':'bg-ink-100 text-ink-700', '管理':'bg-ink-100 text-ink-700' };
      const tp = document.getElementById('topicPill');
      tp.className = 'rounded-full px-2.5 py-0.5 text-xs font-medium ' + (tc[e.topic] || 'bg-ink-100 text-ink-700');
      tp.textContent = e.topic;

      // status
      const sp = document.getElementById('statusPill');
      const sc = { active: 'bg-success-50 text-success-700', paused: 'bg-warning-50 text-warning-700', retired: 'bg-danger-50 text-danger' };
      const sd = { active: 'bg-success', paused: 'bg-warning', retired: 'bg-danger' };
      const sl = { active: '现行', paused: '暂停', retired: '已废止' };
      sp.className = 'inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-medium ' + (sc[e.status] || sc.active);
      sp.innerHTML = `<span class="h-1.5 w-1.5 rounded-full ${sd[e.status] || sd.active}"></span>${sl[e.status] || '现行'}`;

      // tags
      document.getElementById('tags').innerHTML = (e.tags || []).map(t => `<span class="rounded bg-ink-50 px-2 py-0.5 text-xs text-ink-500">#${t}</span>`).join('');

      // content
      const content = document.getElementById('content');
      if (e.content && e.content.length) {
        content.innerHTML = e.content.map(sec => {
          let inner = '';
          if (sec.type === 'list') {
            inner = '<ul>' + sec.items.map(i => `<li>${i}</li>`).join('') + '</ul>';
          } else {
            inner = `<p>${sec.text}</p>`;
          }
          const id = 'h-' + sec.h.replace(/[一二三四五六七八九十]+、?\s*/g, '').replace(/[^\w\u4e00-\u9fa5]+/g, '-').toLowerCase().slice(0, 30);
          return `<h2 id="${id}">${sec.h}</h2>${inner}`;
        }).join('');
        // TOC
        const toc = document.getElementById('toc');
        toc.innerHTML = e.content.map(sec => {
          const id = 'h-' + sec.h.replace(/[一二三四五六七八九十]+、?\s*/g, '').replace(/[^\w\u4e00-\u9fa5]+/g, '-').toLowerCase().slice(0, 30);
          return `<a href="#${id}" class="toc-link block rounded px-2 py-1 text-ink-700 hover:bg-white hover:text-primary">${sec.h.replace(/^[一二三四五六七八九十]+、\s*/, '')}</a>`;
        }).join('');
        // scroll-spy
        const tocLinks = toc.querySelectorAll('.toc-link');
        const headings = content.querySelectorAll('h2');
        const onScroll = () => {
          let active = null;
          headings.forEach(h => { if (h.getBoundingClientRect().top < 100) active = h.id; });
          tocLinks.forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#' + active));
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
      } else {
        content.innerHTML = `<p class="text-ink-500">该经验暂无详细内容，可参考相关经验或联系 AOG 中心获取完整版。</p>`;
        document.getElementById('toc').innerHTML = '';
      }

      // related
      const relatedIds = e.related || [];
      const list = (window.EXPERIENCES || []).filter(x => relatedIds.includes(x.id));
      // fallback: by same topic if no explicit related
      const final = list.length ? list : (window.EXPERIENCES || []).filter(x => x.id !== e.id && x.topic === e.topic).slice(0, 3);
      document.getElementById('related').innerHTML = final.map(r => `
        <a href="experience.html#${r.id}" class="group block rounded-xl border border-ink-100 bg-white p-4 shadow-soft hover:border-primary">
          <div class="mb-1 flex items-center gap-2">
            <span class="rounded-full px-2 py-0.5 text-[10px] font-medium ${tc[r.topic] || 'bg-ink-100 text-ink-700'}">${r.topic}</span>
          </div>
          <div class="text-sm font-semibold text-ink-900 group-hover:text-primary">${r.title}</div>
          <p class="mt-1 line-clamp-2 text-xs text-ink-500">${r.summary}</p>
        </a>
      `).join('');
    }

    // ask AI
    function init() {
      render();
      window.addEventListener('hashchange', render);
      document.getElementById('askAiBtn').addEventListener('click', () => {
        if (window.AOGChat) {
          window.AOGChat.open();
          setTimeout(() => window.AOGChat.ask(document.getElementById('title').textContent + '？'), 100);
        }
      });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  </script>
