name: parent-pm-governance

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile governance validator
        run: python -m compileall validators

      - name: Validate project installation
        run: python validators/validate_install.py .

      - name: Verify exact public Core lock
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          lock = json.loads(Path('.github/skills/chatgpt-parent-pm/GOVERNANCE_LOCK.json').read_text())
          assert lock['core_repository'] == 'zhouzengrui369-commits/chatgpt-parent-pm'
          assert lock['core_commit'] == '99e88020789603f17de715775b455e91e4e20b17'
          assert lock['core_version'] == '0.1.0-alpha'
          assert all(lock['policies'][key] is False for key in (
              'direct_main_write', 'automatic_merge', 'automatic_release'
          ))
          print('PUBLIC_CORE_LOCK: PASS')
          PY

      - name: Verify repository and governance diff discipline
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          base="$(git merge-base HEAD refs/remotes/origin/main)"
          test -n "$base"
          echo "GOAL_BASE=$base"
          git diff --check "$base...HEAD"
          changed="$(git diff --name-only "$base...HEAD")"
          printf '%s\n' "$changed"

          # The adoption-only workflow used to reject every product path.
          # After adoption, product Goals are expected to change approved source
          # paths. Persistent governance instead fails closed if the framework
          # lock or adapter disappears, or unsafe automation policies are set.
          test -f AGENTS.md
          test -f PROJECT_STATUS.md
          test -f .github/skills/chatgpt-parent-pm/SKILL.md
          test -f .github/skills/chatgpt-parent-pm/PROJECT_PROFILE.yaml
          test -f .github/skills/chatgpt-parent-pm/GOVERNANCE_LOCK.json
          python validators/validate_install.py .
