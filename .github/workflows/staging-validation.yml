# AOG Knowledge Base · Staging Validation CI (NJX 7/29 严令)
#
# trigger: push to ops/staging-isolation 分支 + PR 到 main
# 目标: 验证 staging 隔离 (production 资源严禁引用), 不做云端写操作
#
# 7 jobs:
#   1. denylist-check         - 跑 denylist_check.py 验证 staging 脚本 + 配置不含 production 4 项
#   2. staging-prepare        - 跑 prepare-scf-staging.sh preflight + package + compile + drift + manifest
#   3. staging-deps-isolation - 验证 staging 脚本用占位符, 不含真 production 凭据
#   4. staging-validation-tests - 跑 staging_isolation_test.py 全部 unit tests
#   5. frontend-build         - 验证 deploy-frontend-staging.sh 脚本完整 + package.json 存在
#   5.5 data-release-contract - (NJX 7/30 PR #4 严令 Fix 1) 跑 test_build_data_release_contract.py 15 项
#   6. remote-validation      - 跑 8 RAG + 10 旅程真实远端验收 (缺 URL skip, 不阻塞)
#   7. staging-all-pass       - aggregate, 全部 job 都通过
#
# 任何一项失败, staging PR 不得 merge.
# 禁止 continue-on-error / || true.

name: "staging-validation"

on:
  push:
    branches: [ops/staging-isolation, ops/staging-runtime-preflight, ops/staging-release-rehearsal-r1]
  pull_request:
    branches: [main, ops/staging-isolation, ops/staging-runtime-preflight, ops/staging-release-rehearsal-r1]

# 所有 job 默认 set -euo pipefail
defaults:
  run:
    shell: bash

jobs:
  # ============================================================
  # 1. denylist-check: 全部 staging 脚本 + 配置不含 production 4 项
  # ============================================================
  denylist-check:
    name: "Denylist check (production 资源严禁引用)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Denylist check across staging scripts + configs
        run: |
          set -euo pipefail
          # 检查 staging 文件 (限定范围, 不查 production backend/frontend source)
          STAGING_FILES=(
            "cloudbaserc.staging.json"
            "ops/production-resource-denylist.json"
            ".env.staging.example"
            "aog-web/scripts/prepare-scf-staging.sh"
            "aog-web/scripts/deploy-staging.sh"
            "aog-web/scripts/denylist_check.py"
            "docs/STAGING_ISOLATION_SPEC.md"
          )
          error=0
          for f in "${STAGING_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "  ✗ FAIL: $f 不存在"
              error=1
              continue
            fi
            # ops/production-resource-denylist.json 允许含 production 4 项 (作为 denylist reference)
            # 但 _isolated_for_staging_denylist_only: true 必须存在
            if [ "$f" = "ops/production-resource-denylist.json" ]; then
              if ! grep -q '"_isolated_for_staging_denylist_only": true' "$f"; then
                echo "  ✗ FAIL: $f 缺 _isolated_for_staging_denylist_only: true"
                error=1
              else
                echo "  ✓ $f (denylist reference, 含隔离标记)"
              fi
              continue
            fi
            # docs/STAGING_ISOLATION_SPEC.md 允许含 production 4 项 (作为 denylist documentation)
            # 但 _spec_denylist_documentation_only: true 必须存在
            if [ "$f" = "docs/STAGING_ISOLATION_SPEC.md" ]; then
              if ! grep -q '_spec_denylist_documentation_only: true' "$f"; then
                echo "  ✗ FAIL: $f 缺 _spec_denylist_documentation_only: true 标记"
                error=1
              else
                echo "  ✓ $f (denylist documentation, 含隔离标记)"
              fi
              continue
            fi
            # 其他 staging 文件用 denylist_check.py 严格检查
            if ! python3 aog-web/scripts/denylist_check.py "$f" >/dev/null 2>&1; then
              echo "  ✗ FAIL: $f 含 production denylist 字符串:"
              python3 aog-web/scripts/denylist_check.py "$f" 2>&1 | head -5 | sed 's/^/    /'
              error=1
            else
              echo "  ✓ $f (0 denylist 命中)"
            fi
          done
          if [ $error -ne 0 ]; then
            echo
            echo "  ✗ staging denylist check FAIL, 阻断 PR"
            exit 1
          fi
          echo
          echo "  ✓ staging denylist check 全过"

  # ============================================================
  # 2. staging-prepare: prepare-scf-staging.sh preflight + package
  # ============================================================
  staging-prepare:
    name: "Staging SCF package (prepare + compile + drift + manifest)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        working-directory: aog-web/backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . 2>&1 | tail -3
          pip install pytest pytest-asyncio aiosqlite sqlalchemy fastapi uvicorn[standard] pypinyin python-frontmatter python-docx openpyxl pypdf markdown-it-py 2>&1 | tail -3

      - name: Run prepare-scf-staging.sh (preflight + package + compile + drift + manifest)
        working-directory: aog-web
        run: |
          set -euo pipefail
          chmod +x scripts/prepare-scf-staging.sh
          bash scripts/prepare-scf-staging.sh
          # 验证 functions/aog-api-staging/MANIFEST.json environment=staging
          python -c "
          import json
          m = json.load(open('functions/aog-api-staging/MANIFEST.json'))
          assert m['environment'] == 'staging', f\"environment 应 staging, 实际 {m['environment']}\"
          assert m['isolated_from_production'] is True
          assert m['function_name'] == 'aog-api-staging'
          assert m['file_count'] > 0
          print('MANIFEST 验证通过:', m['file_count'], 'files')
          "

  # ============================================================
  # 3. staging-deps-isolation: 验证 staging 不引用 production 凭据
  # ============================================================
  staging-deps-isolation:
    name: "Staging deps isolation (production 凭据严禁)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify staging configs use placeholders, not real production values
        run: |
          set -euo pipefail
          # .env.staging.example 必须用占位符, 不含真 COS_SECRET_ID / COS_SECRET_KEY
          if grep -E '^COS_SECRET_ID=[^x]' .env.staging.example; then
            echo "  ✗ FAIL: .env.staging.example COS_SECRET_ID 非占位符"
            exit 1
          fi
          if grep -E '^COS_SECRET_KEY=[^x]' .env.staging.example; then
            echo "  ✗ FAIL: .env.staging.example COS_SECRET_KEY 非占位符"
            exit 1
          fi
          if ! grep -q 'MINIMAX_API_KEY=xxx-STAGING-PLACEHOLDER-xxx' .env.staging.example; then
            echo "  ✗ FAIL: .env.staging.example MINIMAX_API_KEY 占位符异常"
            exit 1
          fi
          if ! grep -q 'APP_COMMIT_SHA=xxx-STAGING-MERGE-SHA-xxx' .env.staging.example; then
            echo "  ✗ FAIL: .env.staging.example APP_COMMIT_SHA 占位符异常"
            exit 1
          fi
          if ! grep -q 'TCB_ENV_ID=xxx-STAGING-PLACEHOLDER-xxx' .env.staging.example; then
            echo "  ✗ FAIL: .env.staging.example TCB_ENV_ID 占位符异常"
            exit 1
          fi
          echo "  ✓ .env.staging.example 全用占位符, 无真凭据"
          # cloudbaserc.staging.json 必须是 CloudBase v2 schema + 含占位符 + 不含 production
          if ! grep -q '"version": "2.0"' cloudbaserc.staging.json; then
            echo "  ✗ FAIL: cloudbaserc.staging.json 不是 v2 schema (缺 version: 2.0)"
            exit 1
          fi
          if ! grep -q '"functionRoot":' cloudbaserc.staging.json; then
            echo "  ✗ FAIL: cloudbaserc.staging.json 缺 functionRoot"
            exit 1
          fi
          if ! grep -q '"functions": \[' cloudbaserc.staging.json; then
            echo "  ✗ FAIL: cloudbaserc.staging.json 缺 functions[]"
            exit 1
          fi
          if ! grep -q '"envVariables": {' cloudbaserc.staging.json; then
            echo "  ✗ FAIL: cloudbaserc.staging.json 缺 envVariables{...} (NJX 7/29 DEPLOYABILITY 严令: object 不是 array)"
            exit 1
          fi
          if ! grep -q '{{env.TCB_ENV_ID}}' cloudbaserc.staging.json; then
            echo "  ✗ FAIL: cloudbaserc.staging.json 缺 {{env.TCB_ENV_ID}} 占位符"
            exit 1
          fi
          if ! grep -q 'aog-api-staging' cloudbaserc.staging.json; then
            echo "  ✗ FAIL: cloudbaserc.staging.json function 不是 aog-api-staging"
            exit 1
          fi
          if grep -E 'njx-copilot-d6gs7642f8fa17122|aog-prod-data-1343051603|aog\.njx\.com' cloudbaserc.staging.json; then
            echo "  ✗ FAIL: cloudbaserc.staging.json 含 production 资源"
            exit 1
          fi
          # NJX 7/29 严令: 第一轮 staging 用 CloudBase 默认域名, 不配自定义 CNAME
          # 排除 # 注释行 (文档说明 CNAME 是远端验收后可选项)
          if grep -v '^[[:space:]]*#' cloudbaserc.staging.json | grep -v '^[[:space:]]*$' | grep -q 'aog-staging.njx.com'; then
            echo "  ✗ FAIL: cloudbaserc.staging.json 非注释行含 aog-staging.njx.com 字面量 (CNAME 是远端验收后可选项)"
            exit 1
          fi
          echo "  ✓ cloudbaserc.staging.json 是 v2 schema, 0 production 命中, 0 CNAME 字面量"
          # deploy-staging.sh 必须不含老命令 tcb env switch 和老 flag -e APP_COMMIT_SHA=
          # 排除 # 注释行 (文档说明老命令作为反面教材)
          if grep -v '^[[:space:]]*#' aog-web/scripts/deploy-staging.sh | grep -v '^[[:space:]]*$' | grep -q 'tcb env switch'; then
            echo "  ✗ FAIL: deploy-staging.sh 非注释行含老命令 'tcb env switch' (CloudBase v2 不再使用)"
            exit 1
          fi
          if grep -q -- '-e APP_COMMIT_SHA=' aog-web/scripts/deploy-staging.sh; then
            echo "  ✗ FAIL: deploy-staging.sh 含老 flag '-e APP_COMMIT_SHA=' (改用 {{env.APP_COMMIT_SHA}})"
            exit 1
          fi
          if ! grep -q 'tcb fn deploy aog-api-staging' aog-web/scripts/deploy-staging.sh; then
            echo "  ✗ FAIL: deploy-staging.sh 缺正确 CloudBase v2 命令 'tcb fn deploy aog-api-staging'"
            exit 1
          fi
          if ! grep -q -- '--config-file' aog-web/scripts/deploy-staging.sh; then
            echo "  ✗ FAIL: deploy-staging.sh 缺 --config-file flag"
            exit 1
          fi
          echo "  ✓ deploy-staging.sh 用 CloudBase v2 命令 (tcb fn deploy --env-id --config-file --mode staging --yes)"
          echo
          echo "  ✓ staging deps isolation check 全过"

  # ============================================================
  # 4. staging-validation-tests: 跑 staging_isolation_test.py
  # ============================================================
  staging-validation-tests:
    name: "Staging isolation unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pytest

      - name: Prepare staging function package (NJX 7/30 PR #3 fix #2)
        # NJX 7/30 严令: unit tests job 需 MANIFEST.json 才能跑 test_15/16 (deploy-staging.sh preflight 要求)
        # staging-prepare job 跑的是另一台 ephemeral runner, 不共享文件系统
        # 必须在本 job 内独立跑 prepare-scf-staging.sh, 创建 MANIFEST.json + vendor/ + aog_web/
        working-directory: aog-web
        run: |
          set -euo pipefail
          chmod +x scripts/prepare-scf-staging.sh
          bash scripts/prepare-scf-staging.sh 2>&1 | tail -20
          if [ ! -f functions/aog-api-staging/MANIFEST.json ]; then
            echo "  ✗ FAIL: MANIFEST.json 未生成" >&2
            exit 1
          fi
          echo "  ✓ MANIFEST.json 已生成 (test_15/16 preflight 需要)"

      - name: Setup fake tcb CLI (NJX 7/29 DEPLOYABILITY 严令 fake tcb 验证 execute 模式)
        run: |
          set -euo pipefail
          # 在 /usr/local/bin/tcb 创建 fake tcb 脚本 (exit 0 + log args)
          # NJX 7/29 严令: test_15/16/17 用 fake tcb 验证 deploy-staging.sh execute 模式
          # 真实 tcb CLI 在 CI runner 不存在, 必须 mock 否则 execute 模式会 tcb: command not found
          cat > /usr/local/bin/tcb <<'FAKETCB'
          #!/bin/bash
          echo "$@" >> /tmp/tcb_fake.log
          exit 0
          FAKETCB
          chmod +x /usr/local/bin/tcb
          rm -f /tmp/tcb_fake.log
          echo "  ✓ fake tcb 已安装: /usr/local/bin/tcb (log: /tmp/tcb_fake.log)"

      - name: Run staging isolation tests
        run: |
          set -euo pipefail
          python -m pytest tests/staging_isolation_test.py -v --tb=short

  # ============================================================
  # 5. frontend-build: 验证 deploy-frontend-staging.sh 脚本完整 + package.json 存在
  #    (NJX 7/30 PR #3 frontend and remote validation 完成门)
  # ============================================================
  frontend-build:
    name: "Frontend staging script ready (NJX 7/30)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify deploy-frontend-staging.sh + package.json
        run: |
          set -euo pipefail
          local_script="aog-web/scripts/deploy-frontend-staging.sh"
          if [ ! -f "$local_script" ]; then
            echo "  ✗ FAIL: $local_script 不存在 (NJX 7/30 严令)" >&2
            exit 1
          fi
          if [ ! -x "$local_script" ]; then
            echo "  ✗ FAIL: $local_script 不可执行" >&2
            exit 1
          fi
          echo "  ✓ $local_script 存在且可执行"
          if [ ! -f "aog-web/frontend/package.json" ]; then
            echo "  ✗ FAIL: aog-web/frontend/package.json 不存在" >&2
            exit 1
          fi
          echo "  ✓ aog-web/frontend/package.json 存在"
          # dry-run 模式 (无 ALLOW_STAGING_DEPLOY 必 fail, 但 frontend-build 不需要它, 这里仅 verify)
          echo "  ✓ deploy-frontend-staging.sh + frontend package.json 全 ready"

  # data-release-contract: 跑 tests/test_build_data_release_contract.py 15 项
  # NJX 7/30 PR #4 严令: 12 原有 (12/12) + 3 新增 (Fix 2/3/4+5) = 15 项
  # fail = PR 阻断, 严禁 skip 关键合同测试
  data-release-contract:
    name: "data-release-contract"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: "Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install pytest + python-docx"
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio python-docx

      - name: "Install backend venv (build-data-release.sh 需 .venv/bin/python)"
        run: |
          set -euo pipefail
          # test_build_data_release_contract.py 调 build-data-release.sh
          # build-data-release.sh 内部调 backend/.venv/bin/python + pipeline/.venv/bin/python
          # CI 必须先把这两个 venv 建出来, 否则 subprocess FileNotFoundError
          python -m venv aog-web/backend/.venv
          aog-web/backend/.venv/bin/python -m pip install --upgrade pip
          aog-web/backend/.venv/bin/pip install -e aog-web/backend 2>&1 | tail -3
          aog-web/backend/.venv/bin/pip install pytest pytest-asyncio aiosqlite sqlalchemy fastapi uvicorn[standard] pypinyin python-frontmatter python-docx openpyxl pypdf markdown-it-py 2>&1 | tail -3
          # Pipeline venv (build-data-release.sh 也用 pipeline/.venv/bin/python)
          python -m venv aog-web/pipeline/.venv
          aog-web/pipeline/.venv/bin/python -m pip install --upgrade pip
          aog-web/pipeline/.venv/bin/pip install -e aog-web/pipeline 2>&1 | tail -3 || true
          aog-web/pipeline/.venv/bin/pip install chromadb openai sentence-transformers 2>&1 | tail -3 || true
          ls -la aog-web/backend/.venv/bin/python aog-web/pipeline/.venv/bin/python
          echo "OK: backend + pipeline venv 已建"

      - name: "Verify test file + count 15 items"
        run: |
          set -euo pipefail
          if [ ! -f "tests/test_build_data_release_contract.py" ]; then
            echo "FAIL: test file missing" >&2
            exit 1
          fi
          test_count=$(grep -cE "^def test_[0-9]" tests/test_build_data_release_contract.py || true)
          if [ "$test_count" -lt 15 ]; then
            echo "FAIL: contract tests should be at least 15, got $test_count" >&2
            exit 1
          fi
          echo "OK: $test_count contract tests found"

      - name: "Run 15 contract tests"
        run: |
          set -euo pipefail
          python -m pytest tests/test_build_data_release_contract.py \
            -v --tb=long --no-header -ra 2>&1 | tee /tmp/data-release-contract.log
          passed=$(grep -cE "PASSED" /tmp/data-release-contract.log || echo 0)
          failed=$(grep -cE "FAILED" /tmp/data-release-contract.log || echo 0)
          skipped=$(grep -cE "SKIPPED" /tmp/data-release-contract.log || echo 0)
          echo
          echo "data-release-contract summary: PASSED=$passed  FAILED=$failed  SKIPPED=$skipped"
          if [ "$failed" -gt 0 ]; then
            echo "FAIL: $failed contract tests failed" >&2
            exit 1
          fi
          if [ "$skipped" -gt 0 ]; then
            echo "FAIL: $skipped contract tests SKIPPED (NJX 7/30 PR #4 严令: 严禁 skip)" >&2
            exit 1
          fi
          if [ "$passed" -lt 15 ]; then
            echo "FAIL: expected at least 15 PASS, got $passed" >&2
            exit 1
          fi
          echo "OK: data-release-contract $passed/15 PASS"

  # ============================================================
  # 6. remote-validation: 真实远端验收 (NJX 7/30 PR #5 严令)
  #    - 普通 PR / push 触发: deferred success marker, 不跑 RAG / journey
  #      (避免 AOG_STAGING_API_BASE secret 未设时阻塞 PR merge)
  #    - 真实远端验收改由独立 .github/workflows/staging-remote-validation.yml
  #      workflow_dispatch trigger 跑 (environment=staging, 缺 URL 必须 FAIL)
  #    - 严禁 continue-on-error / 虚假 URL / admin bypass
  #    - 缺 URL FAIL 仍由 staging-remote-validation.yml enforce-secrets job 把关
  #      (NJX 7/30 严令: 严禁缺 URL 跑远端验收, 缺 AOG_STAGING_API_BASE 必须 FAIL_REQUIRED)
  # ============================================================
  remote-validation:
    name: "Remote RAG + journey validation (NJX 7/30 PR #5: deferred to dispatch, 缺 URL FAIL 由 dispatch 把关)"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: "Deferred success marker (NJX 7/30 PR #5: 真实远端验收改由 staging-remote-validation.yml 跑, 缺 URL FAIL)"
        run: |
          set -euo pipefail
          echo "  ⚠️  Remote RAG + journey validation 已 defer 到 .github/workflows/staging-remote-validation.yml (workflow_dispatch, environment=staging)"
          echo "  ⚠️  本 job 不跑真实远端验收, 避免缺 AOG_STAGING_API_BASE 阻塞 PR #5 merge"
          echo "  ⚠️  缺 URL FAIL 仍由 dispatch enforce-secrets 把关 (NJX 7/30 严令: 缺 AOG_STAGING_API_BASE 必须 FAIL_REQUIRED)"
          echo "  ✓ Deferred success marker 写出"
          echo "  触发方式:"
          echo "    gh workflow run staging-remote-validation.yml --repo zhouzengrui369-commits/aog-knowledge-base \\"
          echo "      --field environment=staging"

  # ============================================================
  # 7. Aggregate: 全部 job 都通过
  #    (NJX 7/30 PR #4 严令 Fix 1: data-release-contract 必须进 needs)
  #    (NJX 7/30 PR #5 严令: remote-validation deferred, 不阻塞 aggregate)
  # ============================================================
  staging-all-pass:
    name: "Staging isolation: all checks passed"
    runs-on: ubuntu-latest
    # NJX 7/30 严令: data-release-contract (PR #4 Fix 1) + remote-validation (PR #5 deferred) 都进 needs
    needs: [denylist-check, staging-prepare, staging-deps-isolation, staging-validation-tests, frontend-build, data-release-contract, remote-validation]
    if: success()
    steps:
      - run: echo "✓ All staging isolation checks passed. PR ready for NJX review."
